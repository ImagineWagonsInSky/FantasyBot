# FantasyBot in Docker. Use it through ./fb rather than calling compose directly.
#
# Two named volumes hold everything that persists:
#   state    the encrypted LaLiga session and the write-freeze marker
#   secrets  the key that decrypts it, the Telegram bot token and the
#            optional outside-data keys (odds, football-data.org)
# They are kept apart so one can be backed up or inspected without the other.
# Named volumes live inside Docker, not in your home folder, so Time Machine,
# iCloud or Dropbox never pick them up.

name: fantasybot

x-hardening: &hardening
  build: .
  image: fantasybot:local
  user: "10001:10001"
  read_only: true             # nothing in the image can be modified
  cap_drop: [ALL]             # no Linux capabilities at all
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=16m,mode=1777
  pids_limit: 64
  mem_limit: 256m
  cpus: 1.0
  restart: "no"
  env_file:
    - path: ./fantasybot.env  # your settings (chat ID, league, dry run); optional
      required: false
  environment:                # fixed paths; these win over fantasybot.env
    FANTASYBOT_STATE_DIR: /state
    FANTASYBOT_TOKEN_KEY_FILE: /secrets/token_key
    FANTASYBOT_TELEGRAM_BOT_TOKEN_FILE: /secrets/telegram_bot_token
    FANTASYBOT_ODDS_API_KEY_FILE: /secrets/odds_api_key
    FANTASYBOT_FOOTBALL_DATA_TOKEN_FILE: /secrets/football_data_token

services:
  # Everyday runs: health check, auth import/status, telegram test.
  # Secrets are mounted read-only.
  fantasybot:
    <<: *hardening
    volumes:
      - state:/state
      - secrets:/secrets:ro

  # Only for writing secrets: `./fb init` (creates the key),
  # `./fb telegram set-token` and `./fb secret set`.
  setup:
    <<: *hardening
    profiles: [setup]
    volumes:
      - state:/state
      - secrets:/secrets

  # Answers Telegram buttons and commands. Only does anything with
  # FANTASYBOT_ACTIONS=on, and with FANTASYBOT_DRY_RUN=true (the default) it
  # only ever simulates. Started by `./fb listen start`; keeps running and
  # comes back after a reboot until `./fb listen stop`.
  listener:
    <<: *hardening
    profiles: [listener]
    command: ["listen"]
    restart: unless-stopped
    volumes:
      - state:/state
      - secrets:/secrets:ro

volumes:
  state:
  secrets:
